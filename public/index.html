<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suomirap Radio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  :root {
    --glass: rgba(255, 255, 255, 0.045);
    --glass-strong: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 255, 255, 0.09);
    --border-bright: rgba(255, 255, 255, 0.16);
    --text: #f4f2ff;
    --text-dim: rgba(244, 242, 255, 0.55);
    --text-faint: rgba(244, 242, 255, 0.32);
    --accent: #f72585;
    --accent-2: #7b2ff7;
    --live: #ff4d6d;
  }

  html { color-scheme: dark; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Inter", "SF Pro Display", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #06040f;
    color: var(--text);
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Background: layered aurora + grain ---------- */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .5;
  }
  .orb-1 { width: 55vmax; height: 55vmax; background: radial-gradient(circle, #7b2ff7 0%, transparent 65%); top: -25%; left: -15%; animation: drift1 24s ease-in-out infinite; }
  .orb-2 { width: 45vmax; height: 45vmax; background: radial-gradient(circle, #f72585 0%, transparent 65%); bottom: -20%; right: -10%; animation: drift2 30s ease-in-out infinite; }
  .orb-3 { width: 35vmax; height: 35vmax; background: radial-gradient(circle, #22d3ee 0%, transparent 65%); top: 55%; left: 45%; opacity: .28; animation: drift3 36s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(8%, 10%) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-10%, -8%) scale(.95); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0); } 33% { transform: translate(-60px, 40px); } 66% { transform: translate(50px, -30px); } }

  /* film grain for that premium feel */
  .grain {
    position: fixed;
    inset: -50%;
    z-index: 1;
    pointer-events: none;
    opacity: .05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation: grain 8s steps(10) infinite;
  }
  @keyframes grain {
    0%,100% { transform: translate(0,0); } 10% { transform: translate(-5%,-10%); }
    30% { transform: translate(3%,-15%); } 50% { transform: translate(12%,9%); }
    70% { transform: translate(9%,4%); } 90% { transform: translate(-1%,7%); }
  }

  /* ---------- Main glass card ---------- */
  .card {
    position: relative;
    z-index: 2;
    width: min(440px, 94vw);
    border-radius: 32px;
    padding: 34px 32px 26px;
    background: linear-gradient(160deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.03) 40%, rgba(255,255,255,.05) 100%);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--border);
    box-shadow:
      0 40px 90px rgba(0, 0, 0, .6),
      inset 0 1px 0 rgba(255, 255, 255, .14);
    overflow: hidden;
  }
  /* top edge highlight — the signature glass detail */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  }
  /* faint color bleed inside the glass */
  .card::after {
    content: '';
    position: absolute;
    top: -60%; left: -20%;
    width: 70%; height: 100%;
    background: radial-gradient(ellipse, rgba(123,47,247,.16), transparent 65%);
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; position: relative; }
  .live-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,77,109,.1);
    border: 1px solid rgba(255,77,109,.3);
    color: var(--live);
    font-size: 10px; font-weight: 700; letter-spacing: 3px;
    padding: 7px 14px; border-radius: 999px;
    backdrop-filter: blur(8px);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 10px var(--live);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  .bitrate {
    color: var(--text-faint);
    font-size: 10px; letter-spacing: 2px; font-weight: 600;
    text-transform: uppercase;
  }

  /* ---------- Now playing ---------- */
  .np {
    display: flex; align-items: center; gap: 16px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 14px 16px;
    margin-bottom: 12px;
    min-height: 82px;
    position: relative;
    backdrop-filter: blur(12px);
  }
  .np-cover {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: rgba(255,255,255,.06);
    flex-shrink: 0;
    object-fit: cover;
    border: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .np-info { flex: 1; min-width: 0; }
  .np-label {
    font-size: 9px; letter-spacing: 3px;
    color: var(--live); font-weight: 700;
    margin-bottom: 4px;
  }
  .np-track {
    font-weight: 700; font-size: 16px; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-artist {
    font-size: 13px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 2px;
  }
  .np-fresh { font-size: 9px; color: var(--text-faint); margin-top: 5px; letter-spacing: .5px; }

  /* ---------- Search chips ---------- */
  .np-actions { display: flex; gap: 8px; margin-bottom: 22px; }
  .np-actions a {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    text-decoration: none;
    font-size: 11.5px; font-weight: 600;
    color: var(--text-dim);
    background: var(--glass);
    border: 1px solid var(--border);
    padding: 10px 0;
    border-radius: 14px;
    backdrop-filter: blur(8px);
    transition: all .22s ease;
  }
  .np-actions a:hover {
    background: var(--glass-strong);
    color: var(--text);
    border-color: var(--border-bright);
    transform: translateY(-1px);
  }
  .np-actions svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* ---------- Visualizer panel ---------- */
  .viz-panel {
    background: rgba(0, 0, 0, .22);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 26px;
    box-shadow: inset 0 2px 12px rgba(0,0,0,.25);
  }
  #viz { width: 100%; height: 52px; display: block; }

  /* ---------- Play button ---------- */
  .play-wrap {
    position: relative;
    width: 96px; height: 96px;
    margin: 0 auto 28px;
  }
  .play-btn {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    width: 96px; height: 96px;
    border: 1px solid rgba(255,255,255,.2); border-radius: 50%;
    background: linear-gradient(135deg, #8b3dff 0%, #f72585 100%);
    color: #fff; cursor: pointer;
    box-shadow:
      0 16px 45px rgba(247,37,133,.4),
      inset 0 2px 8px rgba(255,255,255,.35),
      inset 0 -4px 12px rgba(0,0,0,.3);
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
  }
  .play-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 20px 60px rgba(247,37,133,.55), inset 0 2px 8px rgba(255,255,255,.4), inset 0 -4px 12px rgba(0,0,0,.3);
  }
  .play-btn:active { transform: scale(.93); }
  .play-btn:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
  .play-btn svg {
    width: 36px; height: 36px;
    fill: currentColor;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.35));
  }
  .play-btn .icon-play { margin-left: 6px; }

  .play-btn .icon-pause { display: none; }
  .playing .play-btn .icon-play  { display: none; }
  .playing .play-btn .icon-pause { display: block; animation: iconIn .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes iconIn {
    0% { transform: scale(.3) rotate(-90deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* glass halo ring while playing */
  .play-ring {
    position: absolute; inset: -8px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #7b2ff7, #f72585, #22d3ee, #7b2ff7);
    opacity: 0; z-index: 0;
    transition: opacity .5s ease;
    filter: blur(2px);
  }
  .playing .play-ring { opacity: .75; animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .play-pulse {
    position: absolute; inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(247,37,133,.3) 0%, transparent 70%);
    opacity: 0; z-index: 0;
    transition: opacity .5s ease;
  }
  .playing .play-pulse { opacity: 1; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: .7; }
    50% { transform: scale(1.15); opacity: .35; }
  }

  /* ---------- Volume ---------- */
  .volume-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 22px;
    backdrop-filter: blur(8px);
  }
  .mute-btn {
    background: none; border: none;
    color: var(--text-dim); cursor: pointer;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: color .2s, background .2s;
  }
  .mute-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .mute-btn svg { width: 20px; height: 20px; fill: currentColor; }

  .volume-slider {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 5px; border-radius: 3px;
    background: linear-gradient(to right, var(--accent) var(--vol, 80%), rgba(255,255,255,.12) var(--vol, 80%));
    outline: none; cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 17px; height: 17px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(247,37,133,.25), 0 3px 10px rgba(0,0,0,.45);
    cursor: pointer; transition: transform .15s, box-shadow .2s;
  }
  .volume-slider::-webkit-slider-thumb:hover {
    transform: scale(1.15);
    box-shadow: 0 0 0 6px rgba(247,37,133,.3), 0 3px 10px rgba(0,0,0,.45);
  }
  .volume-slider::-moz-range-thumb {
    width: 17px; height: 17px; border: none; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 4px rgba(247,37,133,.25), 0 3px 10px rgba(0,0,0,.45); cursor: pointer;
  }
  .vol-value {
    color: var(--text-dim); font-size: 11px; width: 36px; text-align: right;
    font-variant-numeric: tabular-nums; font-weight: 600;
  }

  .footer {
    display: flex; justify-content: center;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .footer a {
    color: var(--text-faint); font-size: 10px; text-decoration: none;
    letter-spacing: 1.5px; font-weight: 600;
    transition: color .2s;
  }
  .footer a:hover { color: var(--text-dim); }

  @media (max-width: 400px) {
    .card { padding: 26px 22px 22px; }
    .np-actions a { font-size: 10.5px; padding: 9px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb, .grain, .play-ring, .play-pulse, .live-dot { animation: none !important; }
  }
</style>
</head>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- DOM refs
  const $ = id => document.getElementById(id);
  const player = $('player');
  const card = $('card');
  const playBtn = $('playBtn');
  const volumeSlider = $('volume');
  const volValue = $('volValue');
  const muteBtn = $('muteBtn');
  const iconVolHigh = muteBtn.querySelector('.icon-vol-high');
  const iconVolLow = muteBtn.querySelector('.icon-vol-low');
  const iconVolMute = muteBtn.querySelector('.icon-vol-mute');
  const npTrack = $('npTrack');
  const npArtist = $('npArtist');
  const npFresh = $('npFresh');
  const npCover = $('npCover');
  const npActions = $('npActions');
  const canvas = $('viz');
  const ctx = canvas.getContext('2d');

  let playing = false;

  // ---------------------------------------------------------------- Volume
  let lastVolume = 0.8;
  player.volume = 0.8;

  function updateVolumeUI() {
    const pct = Math.round(player.volume * 100);
    volValue.textContent = pct + '%';
    volumeSlider.value = pct;
    volumeSlider.style.setProperty('--vol', pct + '%');
    const muted = player.muted || player.volume === 0;
    iconVolHigh.style.display = (!muted && player.volume >= 0.5) ? '' : 'none';
    iconVolLow.style.display = (!muted && player.volume > 0 && player.volume < 0.5) ? '' : 'none';
    iconVolMute.style.display = muted ? '' : 'none';
  }

  volumeSlider.addEventListener('input', () => {
    player.volume = volumeSlider.value / 100;
    player.muted = false;
    if (player.volume > 0) lastVolume = player.volume;
    updateVolumeUI();
  });

  muteBtn.addEventListener('click', () => {
    player.muted = !player.muted;
    if (!player.muted && player.volume === 0) player.volume = lastVolume || 0.8;
    updateVolumeUI();
  });

  // ---------------------------------------------------------------- Playback
  function setPlaying(on) {
    playing = on;
    card.classList.toggle('playing', on);
    if (on) startDrawLoop(); else if (!autoRetry) stopDrawLoop();
  }

  playBtn.addEventListener('click', () => {
    if (player.paused) {
      connectStream();
    } else {
      userPaused = true;
      autoRetry = false;
      player.pause();
      player.removeAttribute('src');
      player.load();
      setPlaying(false);
    }
  });

  let audioCtx = null, analyser = null, freqData = null, mediaSrcFailed = false;

  function connectStream() {
    userPaused = false;
    initAudioGraph();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    player.src = '/api/suomirap?t=' + Date.now(); // fresh redirect every start
    return player.play();
  }

  player.addEventListener('playing', () => setPlaying(true));
  player.addEventListener('error', () => {
    setPlaying(false);
    scheduleReconnect();
  });

  /* ---------- 24/7 autoplay + auto-reconnect ---------- */
  let userPaused = false;   // user pressed pause -> don't fight them
  let autoRetry = false;    // reconnect loop active
  let retryDelay = 1000;

  function scheduleReconnect() {
    if (userPaused || autoRetry) return;
    autoRetry = true;
    retryDelay = 1000;
    reconnectLoop();
  }

  function reconnectLoop() {
    if (userPaused) { autoRetry = false; return; }
    connectStream().then(() => {
      autoRetry = false;
    }).catch(() => {
      // Autoplay blocked or network down -> backoff and try again
      retryDelay = Math.min(retryDelay * 2, 10000);
      setTimeout(reconnectLoop, retryDelay);
    });
  }

  // Watchdog: if the audio freezes (stall without error), force reconnect
  let lastTime = 0;
  setInterval(() => {
    if (!playing || userPaused) return;
    if (player.currentTime === lastTime) {
      player.src = '/api/suomirap?t=' + Date.now();
      player.play().catch(() => {});
    }
    lastTime = player.currentTime;
  }, 5000);

  // Autoplay on page load: try with sound first. If the browser blocks it,
  // start muted (always allowed) and unmute on the first user interaction.
  function attemptAutoplay() {
    connectStream().then(() => {
      // Full sound autoplay allowed (e.g. installed PWA / high engagement)
    }).catch(() => {
      player.muted = true;
      player.src = '/api/suomirap?t=' + Date.now();
      player.play().then(() => {
        showUnmuteBanner();
      }).catch(() => {
        // Even muted autoplay blocked -> fall back to reconnect loop
        scheduleReconnect();
      });
    });
  }

  function showUnmuteBanner() {
    if (document.getElementById('tapBanner')) return;
    const b = document.createElement('div');
    b.id = 'tapBanner';
    b.textContent = 'Selain esti äänen — napauta missä vain kuunteleksesi';
    b.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);' +
      'background:rgba(20,16,40,.9);border:1px solid rgba(255,255,255,.18);color:#fff;' +
      'font:600 13px system-ui;padding:12px 20px;border-radius:999px;z-index:99;' +
      'backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap;';
    document.body.appendChild(b);
    const unmute = () => {
      player.muted = false;
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      b.remove();
      document.removeEventListener('click', unmute);
      document.removeEventListener('keydown', unmute);
      document.removeEventListener('touchstart', unmute);
    };
    document.addEventListener('click', unmute);
    document.addEventListener('keydown', unmute);
    document.addEventListener('touchstart', unmute);
  }

  attemptAutoplay();

  function initAudioGraph() {
    if (audioCtx || mediaSrcFailed) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaElementSource(player);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) {
      mediaSrcFailed = true;
    }
  }

  // ---------------------------------------------------------------- Visualizer
  let fallbackPhase = 0;
  let rafId = null;
  const BAR_COUNT = 40;

  function readSpectrum(bars) {
    analyser.getByteFrequencyData(freqData);
    let max = 0;
    for (let i = 0; i < freqData.length; i++) if (freqData[i] > max) max = freqData[i];
    if (max === 0) return false;

    const usable = Math.floor(freqData.length * 0.75);
    for (let i = 0; i < BAR_COUNT; i++) {
      const lo = Math.floor(Math.pow(i / BAR_COUNT, 1.6) * usable);
      const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / BAR_COUNT, 1.6) * usable));
      let sum = 0;
      for (let j = lo; j < hi; j++) sum += freqData[j];
      bars[i] = sum / (hi - lo) / 255;
    }
    return true;
  }

  function readFallback(bars) {
    fallbackPhase += 0.05;
    for (let i = 0; i < BAR_COUNT; i++) {
      bars[i] = 0.25 + 0.2 * Math.abs(Math.sin(fallbackPhase + i * 0.4));
    }
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
  }

  function draw() {
    rafId = requestAnimationFrame(draw);
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const bars = new Array(BAR_COUNT).fill(0);
    const real = (analyser && freqData) ? readSpectrum(bars) : false;
    if (!real) readFallback(bars);

    let energy = 0;
    for (const v of bars) energy += v;
    energy /= BAR_COUNT;

    const gap = 3 * dpr;
    const barW = (w - gap * (BAR_COUNT - 1)) / BAR_COUNT;
    for (let i = 0; i < BAR_COUNT; i++) {
      const v = Math.min(1, bars[i] * 1.3);
      const barH = Math.max(3 * dpr, v * h);
      const x = i * (barW + gap);
      const grad = ctx.createLinearGradient(0, h - barH, 0, h);
      grad.addColorStop(0, `hsl(${280 + energy * 60}, 90%, ${65 + v * 15}%)`);
      grad.addColorStop(1, 'rgba(123, 47, 247, 0.3)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      const r = Math.min(barW / 2, 3 * dpr);
      ctx.roundRect ? ctx.roundRect(x, h - barH, barW, barH, [r, r, 0, 0]) : ctx.rect(x, h - barH, barW, barH);
      ctx.fill();
    }
  }

  function startDrawLoop() {
    if (rafId === null) {
      resizeCanvas();
      rafId = requestAnimationFrame(draw);
    }
  }
  function stopDrawLoop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  window.addEventListener('resize', () => { if (rafId !== null) resizeCanvas(); });

  // ---------------------------------------------------------------- Now playing
  async function fetchNowPlaying() {
    try {
      const r = await fetch('/api/nowplaying', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (!d.track && !d.artist) return;
      npTrack.textContent = d.track || 'Tuntematon kappale';
      npArtist.textContent = d.artist || '';
      if (d.image) { npCover.src = d.image; npCover.hidden = false; }
      const q = encodeURIComponent((d.artist ? d.artist + ' ' : '') + (d.track || ''));
      $('lnkSpotify').href = 'https://open.spotify.com/search/' + q;
      $('lnkYoutube').href = 'https://www.youtube.com/results?search_query=' + q;
      $('lnkApple').href = d.appleMusic || ('https://music.apple.com/fi/search?term=' + q);
      npActions.hidden = false;
    } catch (e) {
      npTrack.textContent = 'Kappaletietoa ei saatavilla';
      npArtist.textContent = '';
    }
  }
  fetchNowPlaying();
  setInterval(fetchNowPlaying, 30000);
})();
</script>
