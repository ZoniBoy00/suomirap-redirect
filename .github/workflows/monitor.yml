name: Monitor production endpoints

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check live endpoints
        id: probe
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const base = "https://suomirap-redirect.vercel.app";
            const failures = [];
            for (const path of ["/api/health", "/api/nowplaying"]) {
              try {
                const response = await fetch(base + path, { signal: AbortSignal.timeout(10000), cache: "no-store" });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const body = await response.json();
                if (path === "/api/health" && body.status !== "ok") throw new Error("health payload is not ok");
                if (path === "/api/nowplaying" && (!body.track && !body.artist)) throw new Error("now-playing payload has no track or artist");
                if (path === "/api/nowplaying" && body.stale) throw new Error("only stale metadata is available");
              } catch (error) {
                failures.push(`${path}: ${String(error.message || error).slice(0, 300)}`);
              }
            }
            core.setOutput("failed", failures.length ? "true" : "false");
            core.setOutput("details", failures.join("\n").slice(0, 3000));

      - name: Open or close the monitoring issue
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_FAILED: ${{ steps.probe.outputs.failed }}
          PROBE_DETAILS: ${{ steps.probe.outputs.details }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const title = "Production radio endpoint check failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            const failed = process.env.PROBE_FAILED === "true" || process.env.PROBE_OUTCOME === "failure";
            const details = process.env.PROBE_DETAILS || "Probe step failed before returning endpoint details.";
            if (failed) {
              if (!existing) {
                await github.rest.issues.create({
                  ...context.repo,
                  title,
                  body: `The scheduled production check detected an endpoint problem.\n\n\`\`\`text\n${details}\n\`\`\`\n\nThis issue will be closed automatically after a successful check.`
                });
              }
            } else if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed" });
            }
